name: studymate
description: "StudyMate - Student Productivity App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  image_picker: ^1.2.4
  flutter_quill: ^11.6.0
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  url_launcher: ^6.3.3
  open_filex: ^5.0.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
